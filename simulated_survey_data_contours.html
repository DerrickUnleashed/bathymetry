const map = L.map('map', {zoomSnap: 0.25});

const bases = {};
D.basemaps.forEach((b, i) => {
  bases[b.name] = L.tileLayer(b.url, {maxZoom: b.maxZoom, attribution: b.attribution});
  if (i === 0) bases[b.name].addTo(map);
});

const style = f => ({color: f.properties.color, weight: 2, opacity: 0.95});
const styleMajor = f => ({color: f.properties.color, weight: 3.5, opacity: 1});
const tip = (f, l) => l.bindTooltip(D.unit + ': ' + f.properties.level + ' m', {sticky: true});

const minor = L.geoJSON(D.minor, {style, onEachFeature: tip}).addTo(map);
const major = L.geoJSON(D.major, {style: styleMajor, onEachFeature: tip}).addTo(map);

const labels = L.layerGroup().addTo(map);
D.major.features.forEach(f => {
  const c = f.geometry.coordinates;
  if (c.length < 4) return;
  const m = c[Math.floor(c.length / 2)];
  L.marker([m[1], m[0]], {interactive: false, icon: L.divIcon({
    className: '', html: '<div class="lbl">' + f.properties.level + '</div>', iconSize: [0, 0]})
  }).addTo(labels);
});

const overlays = {'Contours (minor)': minor, 'Contours (bold)': major, 'Bold labels': labels};
if (D.points.length) {
  const pts = L.layerGroup();
  D.points.forEach(p => L.circleMarker([p[1], p[0]],
    {radius: 2.5, color: '#fff', weight: 1, fillColor: '#000', fillOpacity: 0.8})
    .bindTooltip(D.unit + ': ' + p[2] + ' m').addTo(pts));
  overlays['Survey points'] = pts;
}

L.control.layers(bases, overlays, {collapsed: false}).addTo(map);
L.control.scale({imperial: false}).addTo(map);

const legend = L.control({position: 'bottomright'});
legend.onAdd = () => {
  const d = L.DomUtil.create('div', 'box');
  d.innerHTML = '<b>' + D.unit + ' (m)</b><br>interval ' + D.interval + ' m<br>' +
    D.legend.map(l => '<span class="sw" style="background:' + l[0] + '"></span>' + l[1]).join('<br>');
  return d;
};
legend.addTo(map);

map.fitBounds(D.bounds, {padding: [30, 30]});
